                if (k === currentPageIndex) { p.classList.remove('hidden'); newPage = p; }
                else p.classList.add('hidden');
            }
            if (newPage) {
                const forward = (dir === 'prev') ? false : (dir === 'next' ? true : (currentPageIndex >= prevIdx));
                newPage.classList.remove('q-anim-right', 'q-anim-left');
                void newPage.offsetHeight;
                newPage.classList.add(forward ? 'q-anim-right' : 'q-anim-left');
            }
            visitedQuestions.add(currentPageIndex);
            const qs = document.getElementById('quizScreen');
            if (qs) qs.scrollTop = 0;
            const cur = document.getElementById('qnavCurrent');
            if (cur) cur.textContent = currentPageIndex + 1;
            const prev = document.getElementById('prevBtn');
            const next = document.getElementById('nextBtn');
            if (prev) prev.disabled = (currentPageIndex === 0);
            if (next) next.disabled = (currentPageIndex === totalPages - 1);

            const submitBtn = document.getElementById('submitBtn');
            const reattemptBtn = document.getElementById('reattemptBtn');
            if (submitBtn && !isSubmitted) {
                if (currentPageIndex === totalPages - 1) submitBtn.classList.remove('hidden');
                else submitBtn.classList.add('hidden');
            }
            if (reattemptBtn && isSubmitted) {
                if (currentPageIndex === totalPages - 1) reattemptBtn.classList.remove('hidden');
                else reattemptBtn.classList.add('hidden');
            }

            updatePaletteHighlight();
            if (!isSubmitted) startQTimer(); else { stopQTimer(); tickQTimer(); }
        }

        function nextQuestion() { if (currentPageIndex < totalPages - 1) showQuestion(currentPageIndex + 1, 'next'); }
        function prevQuestion() { if (currentPageIndex > 0) showQuestion(currentPageIndex - 1, 'prev'); }

        function buildPalette() {
            const grid = document.getElementById('paletteGrid');
            if (!grid) return;
            const flat = getAllQuestionsFlat();
            let out = '';
            for (let i = 0; i < flat.length; i++) {
                out += `<button type="button" class="palette-cell" data-pcell="${i}" onclick="jumpToQuestion(${i})">${i + 1}</button>`;
            }
            grid.innerHTML = out;
            updatePaletteHighlight();
        }

        function updatePaletteHighlight() {
            const flat = getAllQuestionsFlat();
            const total = flat.length;
            let attempted = 0, unattempted = 0, unseen = 0;
            document.querySelectorAll('.palette-cell').forEach(cell => {
                const i = parseInt(cell.getAttribute('data-pcell'), 10);
                const isAtt = attemptedQuestions.has(i);
                const isVisited = visitedQuestions.has(i);
                cell.classList.toggle('attempted', isAtt);
                cell.classList.toggle('unattempted', !isAtt && isVisited);
                cell.classList.toggle('current', i === currentPageIndex);
                if (isAtt) attempted++;
                else if (isVisited) unattempted++;
                else unseen++;
            });
            const attEl = document.getElementById('paletteAttempted');
            const unattEl = document.getElementById('paletteUnattempted');
            const unseenEl = document.getElementById('paletteUnseen');
            if (attEl) attEl.textContent = attempted;
            if (unattEl) unattEl.textContent = unattempted;
            if (unseenEl) unseenEl.textContent = unseen;
            const fill = document.getElementById('paletteProgressFill');
            if (fill) fill.style.width = total ? ((attempted / total) * 100) + '%' : '0%';
        }

        function togglePaletteSection() {
            const body = document.getElementById('paletteTestBody');
            const chev = document.querySelector('.pal-chev');
            if (!body) return;
            const collapsed = body.style.display === 'none';
            body.style.display = collapsed ? '' : 'none';
            if (chev) chev.style.transform = collapsed ? '' : 'rotate(180deg)';
        }

        function submitFromPalette() {
            closePalette();
            if (!isSubmitted) submitQuiz();
        }

        function jumpToQuestion(i) {
            if (isReviewMode) {
                isReviewMode = false;
                const qnav = document.getElementById('qnavBar');
                if (qnav) qnav.classList.remove('hidden');
                const btn = document.getElementById('reviewBtn');
                if (btn) btn.innerHTML = ICO.search + 'Review';
                updateReviewClass();
            }
            showQuestion(i);
            closePalette();
        }

        function updateReviewClass() {
            const f = document.getElementById('quizForm');
            if (f) f.classList.toggle('review-mode', isReviewMode);
        }

        function toggleReviewMode() {
            isReviewMode = !isReviewMode;
            const qnav = document.getElementById('qnavBar');
            const btn = document.getElementById('reviewBtn');
            const submitBtn = document.getElementById('submitBtn');
            const reattemptBtn = document.getElementById('reattemptBtn');
            if (isReviewMode) {
                stopQTimer();
                document.querySelectorAll('#quizForm .question-page').forEach(p => p.classList.remove('hidden'));
                if (qnav) qnav.classList.add('hidden');
                if (submitBtn && !isSubmitted) submitBtn.classList.remove('hidden');
                if (reattemptBtn && isSubmitted) reattemptBtn.classList.remove('hidden');
                if (btn) btn.innerHTML = ICO.list + 'One-by-One';
                const qs = document.getElementById('quizScreen');
                if (qs) qs.scrollTop = 0;
            } else {
                if (qnav) qnav.classList.remove('hidden');
                if (submitBtn && !isSubmitted) {
                    if (currentPageIndex === totalPages - 1) submitBtn.classList.remove('hidden');
                    else submitBtn.classList.add('hidden');
                }
                if (reattemptBtn && isSubmitted) {
                    if (currentPageIndex === totalPages - 1) reattemptBtn.classList.remove('hidden');
                    else reattemptBtn.classList.add('hidden');
                }
                if (btn) btn.innerHTML = ICO.search + 'Review';
                showQuestion(currentPageIndex);
            }
            updateReviewClass();
        }
        function openPalette() {
            const ov = document.getElementById('paletteOverlay');
            if (!ov) return;
            updatePaletteHighlight();
            ov.classList.add('show');
        }
        function closePalette() {
            const ov = document.getElementById('paletteOverlay');
            if (ov) ov.classList.remove('show');
        }
        function togglePalette() {
            const ov = document.getElementById('paletteOverlay');
            if (!ov) return;
            if (ov.classList.contains('show')) closePalette(); else openPalette();
        }

        function setupSwipe() {
            if (swipeReady) return;
            const el = document.getElementById('quizScreen');
            if (!el) return;
            let sx = 0, sy = 0, moved = false;
            el.addEventListener('touchstart', e => {
                if (e.touches.length !== 1) return;
                sx = e.touches[0].clientX; sy = e.touches[0].clientY; moved = false;
            }, { passive: true });
            el.addEventListener('touchmove', e => {
                if (e.touches.length !== 1) return;
                const dx = e.touches[0].clientX - sx;
                const dy = e.touches[0].clientY - sy;
                if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 12) moved = true;
            }, { passive: true });
            el.addEventListener('touchend', e => {
                if (!moved || isReviewMode) return;
                const dx = e.changedTouches[0].clientX - sx;
                const dy = e.changedTouches[0].clientY - sy;
                if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy)) {
                    suppressClickUntil = Date.now() + 350;
                    if (dx < 0) nextQuestion(); else prevQuestion();
                }
            }, { passive: true });
            swipeReady = true;
        }

        function stopTimer() {
            if (timerInterval !== null) { clearInterval(timerInterval); timerInterval = null; }
        }

        function updatePauseIcon() {
            const el = document.getElementById('pauseIcon');
            if (!el) return;
            el.innerHTML = isTimerPaused ? ICO.play : ICO.pause;
        }

        function toggleTimerPause() {
            if (!ENABLE_TIMER || isSubmitted) return;
            if (isTimerPaused) {
                isTimerPaused = false;
                if (totalSecondsRemaining > 0) startTimer(totalSecondsRemaining);
            } else {
                isTimerPaused = true;
                stopTimer();
            }
            updatePauseIcon();
        }

        function updatePauseRing() {
            const ring = document.getElementById('pauseRing');
            if (!ring) return;
            const total = parseInt(TIMER_SECONDS, 10) || 0;
            const remaining = Math.max(0, parseInt(totalSecondsRemaining, 10) || 0);
            const frac = total > 0 ? (1 - remaining / total) : 0;
            const C = 2 * Math.PI * 19;
            ring.style.strokeDasharray = C;
            ring.style.strokeDashoffset = C * (1 - frac);
        }

        async function sha256(text) {
            const msgBuffer = new TextEncoder().encode(text);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        async function hashOption(optionText, optionIndex, salt) {
            const cleanedText = String(optionText).trim();
            const rawString = `${optionIndex}_${cleanedText}_${salt}`;
            return await sha256(rawString);
        }

        function getAllQuestionsFlat() {
            const flatList = [];
            if (!quizData || !quizData.questions) return flatList;
            quizData.questions.forEach(group => {
                if (group.subQuestions && Array.isArray(group.subQuestions)) flatList.push(...group.subQuestions);
                else flatList.push(group);
            });
            return flatList;
        }

        function togglePasswordVisibility(inputId, btn) {
            const input = document.getElementById(inputId);
            if (!input) return;
            if (input.type === 'password') {
                input.type = 'text';
                btn.innerHTML = ICO.eyeClosed;
            } else {
                input.type = 'password';
                btn.innerHTML = ICO.eyeOpen;
            }
        }

        function handleContextMenu(e) { e.preventDefault(); }
        function handleCutCopy(e) { e.preventDefault(); }
        function handleKeyDown(e) {
            if (e.ctrlKey && ['c','u','s','a','p'].includes(e.key.toLowerCase())) e.preventDefault();
        }

        function enableQuizProtection() {
            if (isProtectionEnabled) return;
            document.removeEventListener('contextmenu', handleContextMenu);
            document.removeEventListener('copy', handleCutCopy);
            document.removeEventListener('cut', handleCutCopy);
            document.removeEventListener('keydown', handleKeyDown);
            document.addEventListener('contextmenu', handleContextMenu);
            document.addEventListener('copy', handleCutCopy);
            document.addEventListener('cut', handleCutCopy);
            document.addEventListener('keydown', handleKeyDown);
            isProtectionEnabled = true;
        }

        window.onload = function() {
            if (typeof EMBEDDED_QUIZ !== 'undefined' && EMBEDDED_QUIZ !== null) {
                quizData = EMBEDDED_QUIZ;
                quizId = EMBEDDED_QUIZ_ID || ("quiz_" + Math.abs(hashCode(JSON.stringify(quizData))));

                const genScreen = document.getElementById('generatorScreen');
                const infoScreen = document.getElementById('userInfoScreen');
                if (genScreen && infoScreen) {
                    genScreen.classList.remove('active');
                    genScreen.classList.add('hidden-left');
                    infoScreen.classList.remove('hidden-right', 'hidden-left');
                    infoScreen.classList.add('active');
                }

                document.getElementById('infoQuizTitle').textContent = quizData.title || 'Quiz Test';
                document.getElementById('infoQuizDesc').textContent = quizData.description || '';
                enableQuizProtection();
                setupSwipe();
                autoResumeIfAvailable();
            }
        };

        function hashCode(str) {
            let hash = 0;
            for (let i = 0; i < str.length; i++) { hash = (hash << 5) - hash + str.charCodeAt(i); hash |= 0; }
            return hash;
        }

        function getStorageKey() {
            const cleanName = studentInfo.name.trim().toLowerCase().replace(/\s+/g, '_');
            const cleanExam = (studentInfo.exam || '').trim().toLowerCase().replace(/\s+/g, '_');
            const cleanPass = studentInfo.password.trim();
            return `${quizId}_${cleanName}_${cleanExam}_${cleanPass}`;
        }

        let saveTimer = null;

        function writeStateNow() {
            if (saveTimer !== null) { clearTimeout(saveTimer); saveTimer = null; }
            if (!studentInfo.name || !studentInfo.password) return;
            try {
                localStorage.setItem(getStorageKey(), JSON.stringify({
                    studentInfo,
                    userAnswers,
                    attemptedQuestions: Array.from(attemptedQuestions),
                    visitedQuestions: Array.from(visitedQuestions),
                    isSubmitted,
                    totalSecondsRemaining: parseInt(totalSecondsRemaining, 10),
                    lastScoreData,
                    isResultUnlocked,
                    currentPageIndex,
                    savedAt: Date.now()
                }));
            } catch (e) {}
        }

        /* Debounced: keeps JSON.stringify + localStorage off the tap / scroll path */
        function saveStateToLocal() {
            if (!studentInfo.name || !studentInfo.password) return;
            if (saveTimer !== null) return;
            saveTimer = setTimeout(writeStateNow, 400);
        }

        window.addEventListener('pagehide', writeStateNow);
        document.addEventListener('visibilitychange', function () {
            if (document.visibilityState === 'hidden') writeStateNow();
        });

        function loadStateFromLocal() {
            const saved = localStorage.getItem(getStorageKey());
            if (!saved) return null;
            try { return JSON.parse(saved); } catch (e) { return null; }
        }

        function autoResumeIfAvailable() {
            if (!quizId) return;
            const sessionRaw = localStorage.getItem('active_session_' + quizId);
            if (!sessionRaw) return;
            try {
                const sess = JSON.parse(sessionRaw);
                if (sess && sess.name && sess.password) {
                    const uName = document.getElementById('userName');
                    const uExam = document.getElementById('userExam');
                    const uPass = document.getElementById('userPassword');
                    if (uName) uName.value = sess.name;
                    if (uExam) uExam.value = sess.exam || '';
                    if (uPass) uPass.value = sess.password;

                    studentInfo = { name: sess.name, exam: sess.exam || '', password: sess.password };
                    if (localStorage.getItem(getStorageKey())) startQuizFromInfo();
                }
            } catch (e) {}
        }

        function applyUnattemptedFilter() { updatePaletteHighlight(); }

        function startQuizFromInfo() {
            const name = document.getElementById('userName').value.trim();
            const exam = document.getElementById('userExam').value.trim();
            const password = document.getElementById('userPassword').value.trim();
            if (!name || !exam || !password) return showSnackbar('Please fill in all the details.', 'warning');

            studentInfo = { name, exam, password };
            localStorage.setItem('active_session_' + quizId, JSON.stringify(studentInfo));
            const savedState = loadStateFromLocal();

            document.getElementById('quizTitle').textContent = quizData.title || 'Quiz';
            document.getElementById('quizDesc').textContent = quizData.description || '';

            const totalQCount = quizData.totalQuestionCount || quizData.questions.length;
            const totalCountEl = document.getElementById('totalCount');
            if (totalCountEl) totalCountEl.textContent = totalQCount;

            const form = document.getElementById('quizForm');
            form.innerHTML = '';

            if (savedState) {
                userAnswers = savedState.userAnswers || {};
                attemptedQuestions = new Set(savedState.attemptedQuestions || []);
                visitedQuestions = new Set(savedState.visitedQuestions || []);
                isSubmitted = !!savedState.isSubmitted;
                lastScoreData = savedState.lastScoreData || null;
                isResultUnlocked = !!savedState.isResultUnlocked;
                currentPageIndex = typeof savedState.currentPageIndex === 'number' ? savedState.currentPageIndex : 0;

                if (isSubmitted) {
                    totalSecondsRemaining = 0;
                } else {
                    const savedSecs = parseInt(savedState.totalSecondsRemaining, 10);
                    totalSecondsRemaining = (!isNaN(savedSecs) && savedSecs > 0) ? savedSecs : parseInt(TIMER_SECONDS, 10);
                }
            } else {
                attemptedQuestions.clear();
                visitedQuestions.clear();
                userAnswers = {};
                isSubmitted = false;
                totalSecondsRemaining = parseInt(TIMER_SECONDS, 10);
                lastScoreData = null;
                isResultUnlocked = false;
            }

            const attCountStart = document.getElementById('attemptedCount');
            if (attCountStart) attCountStart.textContent = attemptedQuestions.size;

            const fragment = document.createDocumentFragment();
            let pageCount = 0;

            quizData.questions.forEach((group) => {
                const subList = (group.subQuestions && Array.isArray(group.subQuestions)) ? group.subQuestions : [group];

                subList.forEach((q) => {
                    const qIdx = q.globalIndex;

                    const page = document.createElement('div');
                    page.className = 'question-card question-page hidden';
                    page.setAttribute('data-qpage', pageCount);
                    page.setAttribute('data-gq', qIdx);

                    let pageHTML = `<div class="q-topbar">`
                        + `<span class="q-num">${qIdx + 1}</span>`
                        + `<span class="q-timer-wrap">${ICO.clock}<span class="q-timer">00:00</span></span>`
                        + (ENABLE_POSNEG ? `<span class="q-mark pos">+${fmtMark(POS_MARK)}</span><span class="q-mark neg">-${fmtMark(NEG_MARK)}</span>` : '')
                        + `</div>`;

                    if (group.direction) {
                        pageHTML += `<div class="direction-box">${group.direction}</div>`;
                    }

                    let matchingHTML = '';
                    if (q.isMatching && q.list1 && q.list2) {
                        const maxRows = Math.max(q.list1.length, q.list2.length);
                        let rowsHTML = '';
                        for (let r = 0; r < maxRows; r++) {
                            rowsHTML += `<tr><td>${q.list1[r] || ''}</td><td>${q.list2[r] || ''}</td></tr>`;
                        }
                        matchingHTML = `<div class="matching-table-box"><table class="matching-table"><thead><tr><th>List - I</th><th>List - II</th></tr></thead><tbody>${rowsHTML}</tbody></table></div>`;
                    }

                    let statementsHTML = '';
                    if (q.statements && Array.isArray(q.statements) && q.statements.length > 0) {
                        let stItems = '';
                        q.statements.forEach((st, idx) => {
                            const key = (typeof st === 'object' && st.id) ? st.id : `${idx + 1}.`;
                            const text = (typeof st === 'object' && st.text) ? st.text : st;
                            stItems += `<div class="statement-item"><span class="statement-index">${key}</span><span class="statement-content">${text}</span></div>`;
                        });
                        statementsHTML = `<div class="statements-box">${stItems}</div>`;
                    }

                    pageHTML += `
                        <div class="question-content-box">
                            <div class="question-title">${q.question}</div>
                            ${matchingHTML}
                            ${statementsHTML}
                        </div>
                        ${q.options.map((opt, j) => `<div class="option ripple ${userAnswers[qIdx] === j ? 'selected' : ''}" onclick="selectOption(${qIdx},${j})" data-question="${qIdx}" data-option="${j}"><span class="opt-ind">${j + 1}</span><span class="opt-label">${opt}</span></div>`).join('')}
                    `;

                    page.innerHTML = pageHTML;
                    fragment.appendChild(page);
                    pageCount++;
                });
            });

            form.appendChild(fragment);
            pageEls = Array.from(form.querySelectorAll('.question-page'));

            totalPages = pageCount;
            const qnavTotalEl = document.getElementById('qnavTotal');
            if (qnavTotalEl) qnavTotalEl.textContent = totalPages;

            switchScreen('userInfoScreen', 'quizScreen', 'right');
            buildPalette();

            let startPage = 0;
            if (savedState && typeof savedState.currentPageIndex === 'number') {
                startPage = Math.min(Math.max(0, savedState.currentPageIndex), Math.max(0, totalPages - 1));
            }
            showQuestion(startPage);
            setupSwipe();

            const pauseBtnEl = document.getElementById('pauseBtn');
            if (ENABLE_TIMER) {
                document.getElementById('timerBadge').classList.remove('hidden');
                if (isSubmitted) {
                    if (pauseBtnEl) pauseBtnEl.classList.add('hidden');
                    stopTimer();
                    restoreSubmittedQuizUI();
                } else {
                    if (pauseBtnEl) pauseBtnEl.classList.remove('hidden');
                    updatePauseRing();
                    startTimer(totalSecondsRemaining);
                }
            } else {
                document.getElementById('timerBadge').classList.add('hidden');
                if (pauseBtnEl) pauseBtnEl.classList.add('hidden');
                if (isSubmitted) restoreSubmittedQuizUI();
            }
            saveStateToLocal();
        }

        async function recalculateScoreIfMissing() {
            if (lastScoreData && lastScoreData.total) return;
            const flatQuestions = getAllQuestionsFlat();
            const total = flatQuestions.length;
            let rightAnswers = 0, wrongAnswers = 0;
            for (let i = 0; i < total; i++) {
                const q = flatQuestions[i];
                const selectedValue = userAnswers.hasOwnProperty(i) ? userAnswers[i] : -1;
                if (selectedValue !== -1) {
                    const selectedHash = await hashOption(q.options[selectedValue], selectedValue, quizId);
                    if (selectedHash === q.ansHash) rightAnswers++; else wrongAnswers++;
                }
            }
            const unattempted = total - attemptedQuestions.size;
            const percent = total > 0 ? Math.round((rightAnswers / total) * 100) : 0;
            const marks = (rightAnswers * POS_MARK) - (wrongAnswers * NEG_MARK);
            lastScoreData = { total, unattempted, attempted: attemptedQuestions.size, rightAnswers, wrongAnswers, percent, marks: Math.round(marks * 100) / 100 };
            saveStateToLocal();
        }

        async function restoreSubmittedQuizUI() {
            stopTimer();
            stopQTimer();
            if (ENABLE_TIMER) {
                document.getElementById('timerBadge').classList.remove('hidden');
                const pbR = document.getElementById('pauseBtn'); if (pbR) pbR.classList.add('hidden');
                updateTimerDisplay();
            }
            await recalculateScoreIfMissing();

            const shouldShowAnswers = (!ENABLE_SECRET_KEY) || isResultUnlocked;
            const flatQuestions = getAllQuestionsFlat();

            for (let i = 0; i < flatQuestions.length; i++) {
                const q = flatQuestions[i];
                const selectedValue = userAnswers.hasOwnProperty(i) ? userAnswers[i] : -1;
                const allOptions = document.querySelectorAll(`[data-question="${i}"]`);

                for (const optionDiv of allOptions) {
                    optionDiv.classList.add('disabled');
                    optionDiv.onclick = null;
                    if (shouldShowAnswers) {
                        const optIdx = parseInt(optionDiv.getAttribute('data-option'));
                        const optHash = await hashOption(q.options[optIdx], optIdx, quizId);
                        if (optHash === q.ansHash) {
                            optionDiv.classList.add('correct');
                            setOptionMark(optionDiv, 'correct');
                        }
                        if (selectedValue === optIdx && optHash !== q.ansHash) {
                            optionDiv.classList.add('wrong');
                            setOptionMark(optionDiv, 'wrong');
                        }
                    }
                }
            }

            document.getElementById('submitBtn').classList.add('hidden');
            document.getElementById('reviewBtn').classList.remove('hidden');

            if (!ENABLE_SECRET_KEY || isResultUnlocked) {
                renderScoreCardUI();
                if (currentPageIndex === totalPages - 1) {
                    document.getElementById('reattemptBtn').classList.remove('hidden');
                }
                document.getElementById('pdfBtn').classList.remove('hidden');
            } else {
                renderWaitBoxUI();
            }
            const rcResume = document.getElementById('resultContainer');
            rcResume.classList.remove('hidden');
            setTimeout(() => rcResume.scrollIntoView({ behavior: 'smooth', block: 'start' }), 120);
        }

        function startTimer(seconds) {
            stopTimer();
            totalSecondsRemaining = Math.max(0, parseInt(seconds, 10));
            updateTimerDisplay();
            if (totalSecondsRemaining <= 0) return;
            isTimerPaused = false;
            updatePauseIcon();

            timerInterval = setInterval(() => {
                totalSecondsRemaining--;
                updateTimerDisplay();
                saveStateToLocal();
                if (totalSecondsRemaining <= 0) {
                    stopTimer();
                    showSnackbar('Time is up. Submitting your test.', 'warning');
                    submitQuiz();
                }
            }, 1000);
        }

        function updateTimerDisplay() {
            const currentSeconds = Math.max(0, parseInt(totalSecondsRemaining, 10));
            const hrs = Math.floor(currentSeconds / 3600);
            const mins = Math.floor((currentSeconds % 3600) / 60);
            const secs = currentSeconds % 60;
            document.getElementById('timeDisplay').textContent = `${hrs.toString().padStart(2, '0')}:${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;

            const badge = document.getElementById('timerBadge');
            if (currentSeconds <= 60 && currentSeconds > 0) badge.classList.add('warning');
            else badge.classList.remove('warning');
            updatePauseRing();
        }

        function selectOption(qIdx, optIdx) {
            if (isSubmitted) return;
            if (Date.now() < suppressClickUntil) return;

            const alreadySelected = userAnswers.hasOwnProperty(qIdx) && Number(userAnswers[qIdx]) === Number(optIdx);

            document.querySelectorAll(`[data-question="${qIdx}"]`).forEach(opt => opt.classList.remove('selected'));

            if (alreadySelected) {
                /* tapping the already-selected option un-selects it */
                delete userAnswers[qIdx];
                attemptedQuestions.delete(qIdx);
            } else {
                userAnswers[qIdx] = optIdx;
                attemptedQuestions.add(qIdx);
                const chosen = document.querySelector(`[data-question="${qIdx}"][data-option="${optIdx}"]`);
                if (chosen) chosen.classList.add('selected');
            }

            const attCountEl = document.getElementById('attemptedCount');
            if (attCountEl) attCountEl.textContent = attemptedQuestions.size;

            updatePaletteHighlight();
            saveStateToLocal();
        }

        async function submitQuiz() {
            stopTimer();
            stopQTimer();

            if (ENABLE_TIMER) {
                document.getElementById('timerBadge').classList.remove('hidden');
                const pb = document.getElementById('pauseBtn'); if (pb) pb.classList.add('hidden');
                updateTimerDisplay();
            }

            showOnlyUnattempted = false;
            const pbSubmit = document.getElementById('progressBadge');
            if (pbSubmit) pbSubmit.classList.remove('filter-active');
            applyUnattemptedFilter();

            let rightAnswers = 0, wrongAnswers = 0;
            const flatQuestions = getAllQuestionsFlat();
            const total = flatQuestions.length;
            isSubmitted = true;

            for (let i = 0; i < total; i++) {
                const q = flatQuestions[i];
                const selectedValue = userAnswers.hasOwnProperty(i) ? userAnswers[i] : -1;

                let isCorrect = false;
                if (selectedValue !== -1) {
                    const selectedHash = await hashOption(q.options[selectedValue], selectedValue, quizId);
                    isCorrect = (selectedHash === q.ansHash);
                    if (isCorrect) rightAnswers++; else wrongAnswers++;
                }

                const optionsList = Array.from(document.querySelectorAll(`[data-question="${i}"]`));
                for (const optionDiv of optionsList) {
                    optionDiv.classList.add('disabled');
                    optionDiv.onclick = null;
                    if (!ENABLE_SECRET_KEY) {
                        const optIdx = parseInt(optionDiv.getAttribute('data-option'));
                        const optHash = await hashOption(q.options[optIdx], optIdx, quizId);
                        if (optHash === q.ansHash) {
                            optionDiv.classList.add('correct');
                            setOptionMark(optionDiv, 'correct');
                        }
                        if (selectedValue === optIdx && !isCorrect) {
                            optionDiv.classList.add('wrong');
                            setOptionMark(optionDiv, 'wrong');
                        }
                    }
                }
            }

            const unattempted = total - attemptedQuestions.size;
            const percent = total > 0 ? Math.round((rightAnswers / total) * 100) : 0;
            const marks = (rightAnswers * POS_MARK) - (wrongAnswers * NEG_MARK);
            lastScoreData = { total, unattempted, attempted: attemptedQuestions.size, rightAnswers, wrongAnswers, percent, marks: Math.round(marks * 100) / 100 };

            saveStateToLocal();

            if (ENABLE_SECRET_KEY) {
                renderWaitBoxUI();
            } else {
                renderScoreCardUI();
                if (currentPageIndex === totalPages - 1) {
                    document.getElementById('reattemptBtn').classList.remove('hidden');
                }
                document.getElementById('pdfBtn').classList.remove('hidden');
            }
            document.getElementById('reviewBtn').classList.remove('hidden');
            const rcEl = document.getElementById('resultContainer');
            rcEl.classList.remove('hidden');
            document.getElementById('submitBtn').classList.add('hidden');
            setTimeout(() => rcEl.scrollIntoView({ behavior: 'smooth', block: 'start' }), 120);

            if (ENABLE_FORMSUBMIT) sendEmailNotification();
        }

        function renderWaitBoxUI() {
            const secretKeyHTML = ENABLE_SECRET_KEY ? `
                <div class="secret-key-area">
                    <button type="button" id="triggerSecretBtn" class="btn ripple" onclick="revealSecretInput()">${ICO.key}Unlock with Secret Key</button>
                    <div id="secretInputBoxUI" class="expand-box" style="display:none;">
                        <div class="pw-wrap" style="margin-bottom:12px;">
                            <input type="password" id="userEnteredKey" placeholder="Enter secret password / key">
                            <button type="button" class="eye-btn" onclick="togglePasswordVisibility('userEnteredKey', this)" aria-label="Show key">
                                ${ICO.eyeOpen}
                            </button>
                        </div>
                        <button class="btn btn-block ripple" onclick="verifySecretKey()">Unlock</button>
                    </div>
                </div>` : '';

            document.getElementById('resultContainer').innerHTML = `
                <div class="wait-box">
                    ${secretKeyHTML}
                    <h3>${ICO.hourglass}Waiting for Result</h3>
                    <p>Your test has been submitted. The result will be reviewed and released by the administrator.</p>
                </div>`;
        }

        function revealSecretInput() {
            const t = document.getElementById('triggerSecretBtn');
            const b = document.getElementById('secretInputBoxUI');
            if (t) t.style.display = 'none';
            if (b) b.style.display = 'block';
        }

        async function verifySecretKey() {
            const input = document.getElementById('userEnteredKey');
            const userInput = input ? input.value.trim() : '';
            if (!userInput) return showSnackbar('Please enter the key.', 'warning');

            const inputHash = await sha256(userInput);

            if (inputHash === SECRET_KEY_HASH) {
                showSnackbar('Key verified. Result unlocked.', 'success');
                isResultUnlocked = true;
                saveStateToLocal();
                restoreSubmittedQuizUI();
            } else {
                showSnackbar('Incorrect key. Please try again.', 'error');
            }
        }

        function renderScoreCardUI() {
            const d = lastScoreData;
            const pct = Math.max(0, Math.min(100, d.percent || 0));
            const R = 33, C = 2 * Math.PI * R;
            const offset = C * (1 - pct / 100);

            document.getElementById('resultContainer').innerHTML = `
                <div class="result-box">
                    <h3>${ICO.chart}Quiz Scorecard</h3>
                    <div class="score-hero">
                        <div class="score-ring">
                            <svg viewBox="0 0 78 78">
                                <circle class="sr-bg" cx="39" cy="39" r="${R}"></circle>
                                <circle class="sr-fg" id="scoreRingFg" cx="39" cy="39" r="${R}" style="stroke-dasharray:${C};stroke-dashoffset:${C}"></circle>
                            </svg>
                            <span class="sr-val">${pct}%</span>
                        </div>
                        <div class="sh-meta">
                            <div class="sh-name">${studentInfo.name || '-'}</div>
                            <div class="sh-sub">${studentInfo.exam || '-'}</div>
                        </div>
                    </div>
                    <table class="stats-table">
                        <tr><td>Score</td><td class="val">${d.rightAnswers} / ${d.total}</td></tr>
                        <tr><td>Percentage</td><td class="val">${d.percent}%</td></tr>
                        <tr><td>Attempted</td><td class="val">${d.attempted}</td></tr>
                        <tr><td>Unattempted</td><td class="val">${d.unattempted}</td></tr>
                        <tr><td>Correct</td><td class="val" style="color:var(--success);">${d.rightAnswers}</td></tr>
                        <tr><td>Wrong</td><td class="val" style="color:var(--error);">${d.wrongAnswers}</td></tr>
                        ${ENABLE_POSNEG ? `<tr><td>Marks (+${fmtMark(POS_MARK)} / -${fmtMark(NEG_MARK)})</td><td class="val" style="color:var(--brand-700);">${d.marks}</td></tr>` : ''}
                    </table>
                </div>`;

            const fg = document.getElementById('scoreRingFg');
            if (fg) requestAnimationFrame(() => { fg.style.strokeDashoffset = offset; });
        }

        function sendEmailNotification() {
            const d = lastScoreData;
            fetch(`https://formsubmit.co/ajax/${FORMSUBMIT_KEY}`, {
                method: "POST",
                headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                body: JSON.stringify({
                    _subject: `Quiz Result: ${studentInfo.name} [${studentInfo.exam}] (${d.percent}%)`,
                    Student_Name: studentInfo.name,
                    Exam_Name: studentInfo.exam,
                    Quiz_Title: quizData.title || 'Quiz Test',
                    Score: `${d.rightAnswers}/${d.total}`,
                    percentage: `${d.percent}%`,
                    Unattempted: d.unattempted,
                    Attempted: d.attempted,
                    Right: d.rightAnswers,
                    wrong: d.wrongAnswers
                })
            }).catch(() => {});
        }

        function downloadPDF() {
            closePalette();
            setTimeout(() => { window.print(); }, 200);
        }

        function retryQuiz() {
            stopTimer();

            isSubmitted = false;
            isResultUnlocked = false;
            showOnlyUnattempted = false;
            attemptedQuestions.clear();
            visitedQuestions.clear();
            qElapsed = {};
            stopQTimer();
            userAnswers = {};
            totalSecondsRemaining = parseInt(TIMER_SECONDS, 10);

            const attCountReset = document.getElementById('attemptedCount');
            if (attCountReset) attCountReset.textContent = '0';
            const pbReset = document.getElementById('progressBadge');
            if (pbReset) pbReset.classList.remove('filter-active');

            isReviewMode = false;
            updateReviewClass();
            const rvBtn = document.getElementById('reviewBtn');
            if (rvBtn) { rvBtn.classList.add('hidden'); rvBtn.innerHTML = ICO.search + 'Review'; }
            const qnavReset = document.getElementById('qnavBar');
            if (qnavReset) qnavReset.classList.remove('hidden');

            document.querySelectorAll('.option').forEach(opt => {
                opt.classList.remove('disabled', 'selected', 'correct', 'wrong');
                const markEl = opt.querySelector('.opt-mark');
                if (markEl) markEl.innerHTML = '';
                const qIdx = parseInt(opt.getAttribute('data-question'));
                const optIdx = parseInt(opt.getAttribute('data-option'));
                opt.onclick = () => selectOption(qIdx, optIdx);
            });

            applyUnattemptedFilter();
            showQuestion(0);

            document.getElementById('resultContainer').innerHTML = '';
            document.getElementById('resultContainer').classList.add('hidden');
            document.getElementById('reattemptBtn').classList.add('hidden');
            document.getElementById('pdfBtn').classList.add('hidden');

            isTimerPaused = false;
            updatePauseIcon();
            const pbRetry = document.getElementById('pauseBtn');
            if (ENABLE_TIMER && TIMER_SECONDS > 0) {
                document.getElementById('timerBadge').classList.remove('hidden');
                if (pbRetry) pbRetry.classList.remove('hidden');
                updateTimerDisplay();
                startTimer(TIMER_SECONDS);
            } else {
                document.getElementById('timerBadge').classList.add('hidden');
                if (pbRetry) pbRetry.classList.add('hidden');
            }

            saveStateToLocal();
        }

        document.addEventListener('click', function(e) {
            const target = e.target.closest('.ripple');
            if (!target) return;
            const rect = target.getBoundingClientRect();
            const ripple = document.createElement('span');
            ripple.className = 'ripple-effect';
            const size = Math.max(rect.width, rect.height);
            ripple.style.width = ripple.style.height = size + 'px';
            ripple.style.left = (e.clientX - rect.left - size / 2) + 'px';
            ripple.style.top = (e.clientY - rect.top - size / 2) + 'px';
            target.appendChild(ripple);
            setTimeout(() => ripple.remove(), 620);
        });
    </script>
